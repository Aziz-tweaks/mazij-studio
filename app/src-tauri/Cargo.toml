[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"
# بند #20 أضاف ثنائي `mcp_server` المستقل، فصار للحزمة ثنائيّان ولم يعد Tauri
# يعرف أيّهما يحزّم فيفشل البناء النهائي. هذا السطر يحسم أن التطبيق هو الأساسي.
default-run = "app"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-fs = "2.7.1"
tauri-plugin-http = "2.8.3"
tauri-plugin-dialog = "2.8.3"
tauri-plugin-shell = "2"
# Roadmap #20 (MCP server): a tiny, synchronous, pure-Rust HTTP server — no tokio/
# async runtime needed anywhere else in this crate, and small enough to also build
# as the standalone `mcp_server` QA binary (src/bin/mcp_server.rs) with no Tauri
# dependency at all.
tiny_http = "0.12"

[target.'cfg(target_os = "macos")'.dependencies]
# مزيج يبقى صاحيًا ما دام وكيلٌ مربوطًا به — انظر src/awake.rs.
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
